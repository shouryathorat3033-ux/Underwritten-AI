<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sample PAN Card</title>
<style>
  body { margin: 0; padding: 20px; background: #f5f5f5; font-family: 'Arial', sans-serif; }
  .card { width: 420px; height: 260px; background: linear-gradient(135deg, #fff8e1, #fff3c4); border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: relative; overflow: hidden; border: 1px solid #f0c14b; }
  .header { text-align: center; margin-bottom: 10px; border-bottom: 2px solid #1565c0; padding-bottom: 8px; }
  .title-govt { font-size: 10px; color: #333; letter-spacing: 0.5px; }
  .title-main { font-size: 15px; font-weight: bold; color: #1565c0; margin: 2px 0; }
  .title-dept { font-size: 9px; color: #555; }
  .body { display: flex; gap: 16px; margin-top: 10px; }
  .photo { width: 80px; height: 90px; background: #f5f5f5; border: 1px solid #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #999; font-size: 10px; }
  .info { flex: 1; }
  .field { margin-bottom: 5px; }
  .label { font-size: 8px; color: #888; text-transform: uppercase; }
  .value { font-size: 12px; color: #222; font-weight: 500; }
  .pan-num { font-size: 22px; font-weight: bold; color: #1565c0; letter-spacing: 4px; text-align: center; margin-top: 10px; }
  .sign-area { display: flex; justify-content: space-between; margin-top: 8px; font-size: 8px; color: #999; }
  .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-30deg); font-size: 60px; color: rgba(21,101,192,0.04); font-weight: bold; pointer-events: none; }
</style></head><body>
<div class="card">
  <div class="watermark">SAMPLE</div>
  <div class="header">
    <div class="title-govt">GOVERNMENT OF INDIA | भारत सरकार</div>
    <div class="title-main">INCOME TAX DEPARTMENT</div>
    <div class="title-dept">PERMANENT ACCOUNT NUMBER CARD</div>
  </div>
  <div class="body">
    <div class="photo">PHOTO</div>
    <div class="info">
      <div class="field"><div class="label">Name</div><div class="value">PRIYA SHARMA</div></div>
      <div class="field"><div class="label">Father's Name</div><div class="value">RAJESH SHARMA</div></div>
      <div class="field"><div class="label">Date of Birth</div><div class="value">15/03/1998</div></div>
    </div>
  </div>
  <div class="pan-num">ABCPS1234F</div>
  <div class="sign-area">
    <span>Signature / हस्ताक्षर</span>
    <span>Sample document for testing</span>
  </div>
</div>
</body></html>
