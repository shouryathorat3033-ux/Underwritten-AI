services:
  - type: web
    name: underwriteai-api
    runtime: python
    region: oregon
    rootDir: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --log-level info
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: test
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: PYTHON_VERSION
        value: "3.11.9"
